name: Solana Localnet Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solana-tests:
    name: Build and Test SPL Swap
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Solana CLI 2.3.0
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Anchor Version Manager
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install and select Anchor 0.32.1
        run: |
          avm --version
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          avm --version
          anchor --version
          node --version
          npm --version

      - name: Configure local wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --outfile "$HOME/.config/solana/id.json"
          solana config set --url localhost
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"

      - name: Build and run Localnet tests
        run: |
          cd anchor
          anchor test
